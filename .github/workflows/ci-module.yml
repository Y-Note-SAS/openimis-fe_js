name: CI Module Test

on:
  workflow_call:
    inputs:
      module-path:
        required: true
        type: string
      repo:
        required: true
        type: string

jobs:
  test-module:
    runs-on: ubuntu-latest

    steps:
      # Checkout du module courant dans le dossier spécifié par module-path
      - name: Checkout module
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          path: ${{ inputs.module-path }}

      # Checkout du front-end openimis-fe_js
      - name: Checkout openimis-fe_js
        uses: actions/checkout@v4
        with:
          path: .
          repository: ${{ github.repository }}

      - name: Lister les fichiers
        run: |
          echo "Contenu du workspace :"
          ls -R $GITHUB_WORKSPACE

      # Installer Node
      - name: Node setup
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Définir MODULE_PATH pour que tous les scripts Node le connaissent
      - name: Set MODULE_PATH env
        run: echo "MODULE_PATH=${GITHUB_WORKSPACE}/${{ inputs.module-path }}" >> $GITHUB_ENV

      # Générer openimis.json dynamiquement
      - name: Generate openimis.json
        run: node $GITHUB_WORKSPACE/generate-openimis.json.js
      # Installer toutes les dépendances via yarn
      - name: Install dependencies
        run: |
          cd $GITHUB_WORKSPACE
          yarn load-config
          yarn install

      # Calculer MODULE_NAME à partir de module-path et lancer les tests Jest
      - name: Run Jest tests for module
        run: |
          MODULE_NAME=$(basename ${{ inputs.module-path }} | sed 's/_js$//')
          cd $GITHUB_WORKSPACE
          npx jest --testPathPattern="node_modules/@openimis/$MODULE_NAME/tests"
